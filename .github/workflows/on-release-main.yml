name: release-main

on:
  release:
    types: [published]

jobs:
  set-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Export tag
        id: export-tag
        run: echo tag=${GITHUB_REF#refs/*/} >> $GITHUB_OUTPUT
        if: ${{ github.event_name == 'release' }}

      - name: Update project version
        run: |
          sed -i "s/^version = \".*\"/version = \"${RELEASE_VERSION#v}\"/" pyproject.toml
          grep "^version" pyproject.toml
        env:
          RELEASE_VERSION: ${{ steps.export-tag.outputs.tag }}
        if: ${{ github.event_name == 'release' }}

      - name: Upload updated pyproject.toml
        uses: actions/upload-artifact@v7
        with:
          name: pyproject-toml
          path: pyproject.toml

  publish:
    runs-on: ubuntu-latest
    needs: [set-version]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download updated pyproject.toml
        uses: actions/download-artifact@v7
        with:
          name: pyproject-toml

      - name: Set up the environment
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Build dist
        run: |
          pip install build
          python -m build

      - name: Twine check
        run: |
          pip install twine
          twine check --strict dist/*
          pip install dist/*.whl

      - name: Publish package
        run: python -m twine upload --repository testpypi dist/*

  deploy-docs:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7
        
      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          extra-packages: "pymdown-extensions<12.2"

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch gh-pages branch
        run: git fetch origin gh-pages --depth=1 || true

      - name: Deploy documentation
        run: uv run mike deploy -F mkdocs.yaml --push --update-aliases "$GITHUB_REF_NAME" latest


